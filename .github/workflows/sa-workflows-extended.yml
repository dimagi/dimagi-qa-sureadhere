# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: SureAdhere Tests - Extended

on:
  schedule:
    - cron: '30 11 * * 4'
  push:
    branches-ignore:
      - main   # run on all branches except master
  pull_request:
    branches-ignore:
      - main   # ignore PRs targeting master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'banner (Staging)'
        type: choice
        options:
          - banner (Staging)
          - rogers (QA)
          - securevoteu (EU Prod)
          - secure (US Prod)
          - all_no_rogers

concurrency:
  group: sa-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix-schedule.outputs.matrix || steps.set-matrix-deploy.outputs.matrix || steps.set-matrix-manual.outputs.matrix || steps.set-matrix-default.outputs.matrix }}
    steps:
      - id: set-matrix-manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          env_input="${{ inputs.environment }}"
          env_key="${env_input%% (*}"
          if [ "$env_key" = "all_no_rogers" ]; then
            echo "::set-output name=matrix::{\"environment\": [\"banner\", \"securevoteu\", \"secure\"]}"
          else
            echo "::set-output name=matrix::{\"environment\": [\"$env_key\"]}"
          fi
      - id: set-matrix-default
        if: ${{ !contains(github.event_name , 'dispatch') }}
        run: |
          echo "::set-output name=matrix::{\"environment\": [\"banner\", \"securevoteu\", \"secure\"]}"
      - id: set-matrix-schedule
        if: ${{ !contains(github.event_name , 'schedule') }}
        run: |
          echo "::set-output name=matrix::{\"environment\": [\"banner\", \"securevoteu\", \"secure\"]}"
          
  build:
    needs: set_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
    name: SA Extended Tests on '${{ matrix.environment }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.13
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requires.txt

      - name: Install Tesseract + English lang
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: SureAdhere Extended Tests with pytest
        env:
          DIMAGIQA_ENV: ${{ matrix.environment }}
          DIMAGIQA_LOGIN_USERNAME: ${{ secrets.DIMAGIQA_LOGIN_USERNAME }}
          DIMAGIQA_LOGIN_PASSWORD: ${{ secrets.DIMAGIQA_LOGIN_PASSWORD }}
          DIMAGIQA_ADMIN_USERNAME: ${{ secrets[format('DIMAGIQA_ADMIN_{0}_USERNAME', matrix.environment)] }}
          DIMAGIQA_ADMIN_PASSWORD: ${{ secrets.DIMAGIQA_ADMIN_PASSWORD }}
          DIMAGIQA_BS_USER: ${{ secrets.DIMAGIQA_BS_USER }}
          DIMAGIQA_BS_KEY: ${{ secrets.DIMAGIQA_BS_KEY }}
          DIMAGIQA_SA_IMAP_PASSWORD: ${{ secrets.DIMAGIQA_SA_IMAP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          echo "client_payload: ${{ toJson(github.event.client_payload) }}"
          echo "matrix environment: ${{ matrix.environment }}"
          echo "NOW=$(date +'%m-%d %H:%M')" >> $GITHUB_ENV
          echo "DIMAGIQA_ENV=${{ matrix.environment }}" >> $GITHUB_ENV
          echo "${{env.NOW}}"
          echo "${{env.DIMAGIQA_ENV}}"
          google-chrome --version || true
          pytest -vv -m presetup\
            --browser=chrome --headless --headless2 \
            --reruns 1 \
            --dashboard --html=presetup_extendedtests-report-${{ matrix.environment }}.html  --tb=short --maxfail=1
          pytest -vv -m extendedtests \
            --browser=chrome --headless --headless2 \
            --reruns 1 -n 5 --dist=loadscope\
            --dashboard --html=extendedtests-report-${{ matrix.environment }}.html --tb=short \
            --junitxml=extendedtests-report-${{ matrix.environment }}.xml

      - name: AI Failure Analysis
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python utils/ai_failure_analyst.py extendedtests-report-${{ matrix.environment }}.xml

      - name: Upload AI Failure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-report-${{ matrix.environment }}
          path: ai_failure_report.md
          if-no-files-found: ignore

      - name: Parse test counts
        id: parse_counts
        if: always()
        run: |
          # Extract variables from the api_test_counts.txt file
          while IFS= read -r line; do
            echo "::set-output name=${line%=*}::${line#*=}"
          done < sa_test_counts_${{ matrix.environment }}.txt

      - name: Zip reports for email
        if: always()
        run: |
          rm -f sbase-extendedtests-artifacts-${{ matrix.environment }}.zip || true
          zip -r sbase-extendedtests-artifacts-${{ matrix.environment }}.zip extendedtests-report-${{ matrix.environment }}.html latest_logs dashboard.html presetup_extendedtests-report-${{ matrix.environment }}.html

      - name: Upload reports & logs
        id: artifact-upload-step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbase-extendedtests-artifacts-${{ matrix.environment }}
          path: sbase-extendedtests-artifacts-${{ matrix.environment }}.zip

      - name: Create run summary for dashboard
        if: always()
        run: |
          mkdir -p metrics_out

          python <<'PY'
          import json, os, datetime

          env = os.environ.get("DIMAGIQA_ENV", "unknown")

          counts_file = f"sa_test_counts_{env}.txt"

          event_name = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          trigger_map = {
              "schedule": "Scheduled",
              "workflow_dispatch": "Manual",
              "push": "Push/Pull",
              "pull_request": "Push/Pull",
          }

          data = {
              "timestamp_utc": datetime.datetime.utcnow().isoformat() + "Z",
              "env": env,
              "suite": "SureAdhere Tests - Extended",
              "status": "pass",
              "passed": 0,
              "failed": 0,
              "skipped": 0,
              "rerun_count": 0,
              "trigger": trigger_map.get(event_name, event_name),
              "github": {
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_url": f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
              }
          }

          if os.path.exists(counts_file):
              with open(counts_file) as f:
                  for line in f:
                      k, v = line.strip().split("=")
                      v = int(v)
                      if k == "PASSED": data["passed"] = v
                      if k == "FAILED": data["failed"] = v
                      if k == "SKIPPED": data["skipped"] = v

          data["status"] = "fail" if data["failed"] > 0 else "pass"

          with open("metrics_out/run_summary.json", "w") as f:
              json.dump(data, f)

          print("run_summary.json created")
          PY

      - name: Upload run summary JSON (central dashboard)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ matrix.environment }}
          path: metrics_out/run_summary.json
          retention-days: 30



      - name: Map env display name
        if: always()
        id: env_display
        run: |
          case "${{ matrix.environment }}" in
            banner)      echo "display_name=Staging" >> $GITHUB_OUTPUT ;;
            rogers)      echo "display_name=QA" >> $GITHUB_OUTPUT ;;
            secure)      echo "display_name=US Prod" >> $GITHUB_OUTPUT ;;
            securevoteu) echo "display_name=EU Prod" >> $GITHUB_OUTPUT ;;
            *)           echo "display_name=${{ matrix.environment }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set slack vars
        if: ${{ !cancelled() }}
        id: configure_slack
        uses: actions/github-script@v6
        with:
          result-encoding: string
          script: |
            return '${{ secrets.SLACK_CHANNEL_ID_SA_RELEASE }}'

      - name: Upload Combined Chart to Slack
        if: ${{ !cancelled() && steps.configure_slack.outputs.result != '' }}
        env:
          SLACK_TOKEN:    ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL:  ${{ steps.configure_slack.outputs.result }}
          JOB_STATUS:     ${{ job.status }}
          ENV_DISPLAY:    ${{ steps.env_display.outputs.display_name }}
          PASSED:         ${{ steps.parse_counts.outputs.PASSED }}
          FAILED:         ${{ steps.parse_counts.outputs.FAILED }}
          ERROR:          ${{ steps.parse_counts.outputs.ERROR }}
          SKIPPED:        ${{ steps.parse_counts.outputs.SKIPPED }}
          XFAIL:          ${{ steps.parse_counts.outputs.XFAIL }}
          ARTIFACT_ID:    ${{ steps.artifact-upload-step.outputs.artifact-id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os, pathlib, time
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError

          token   = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured — skipping")
              raise SystemExit(0)

          job_status  = os.environ.get("JOB_STATUS", "failure")
          env_display = os.environ.get("ENV_DISPLAY", "")
          passed      = os.environ.get("PASSED", "0")
          failed      = os.environ.get("FAILED", "0")
          error       = os.environ.get("ERROR", "0")
          skipped     = os.environ.get("SKIPPED", "0")
          xfail       = os.environ.get("XFAIL", "0")
          run_number  = os.environ.get("GITHUB_RUN_NUMBER", "")
          run_id      = os.environ.get("GITHUB_RUN_ID", "")
          repo        = os.environ.get("GITHUB_REPOSITORY", "")
          server      = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          artifact_id = os.environ.get("ARTIFACT_ID", "")
          workflow    = os.environ.get("GITHUB_WORKFLOW", "SureAdhere Tests - Extended")
          event       = os.environ.get("GITHUB_EVENT_NAME", "")

          status_icon  = "✅" if job_status == "success" else "❌"
          artifact_url = f"{server}/{repo}/actions/runs/{run_id}/artifacts/{artifact_id}"
          event_map = {
              "schedule": "SCHEDULED TRIGGER", "workflow_dispatch": "MANUAL TRIGGER",
              "push": "PUSH/PULL", "pull_request": "PUSH/PULL",
              "repository_dispatch": "DEPLOY_SUCCESS",
          }
          event_label = event_map.get(event, event.upper() or "UNKNOWN")

          message = (
              f"{status_icon} 📊 *[{env_display}] {workflow} Run #{run_number} — {event_label}*\n\n"
              f"*Passed:* {passed}  *Failed:* {failed}  *Error:* {error}  *Skipped:* {skipped}  *XFail:* {xfail}\n\n"
              f"📎 *Artifact:* <{artifact_url}|Download here>\n"
              f"🔗 *Dashboard:* https://dimagi.github.io/dimagi-qa-sureadhere/"
          )

          client = WebClient(token=token)
          png_path = "slack_charts/summary_combined.png"
          parent_ts = None

          if pathlib.Path(png_path).exists():
              try:
                  client.files_upload_v2(
                      file=png_path,
                      filename="summary_combined.png",
                      title="Test Summary",
                      channel=channel,
                      initial_comment=message,
                  )
                  print("Chart + summary posted to Slack")
                  time.sleep(2)
                  try:
                      now = time.time()
                      history = client.conversations_history(channel=channel, limit=5)
                      for msg in history.get("messages", []):
                          if now - float(msg.get("ts", 0)) < 60 and msg.get("files"):
                              if env_display.upper() in (msg.get("text", "") or "").upper():
                                  parent_ts = msg["ts"]
                                  break
                  except Exception as ts_err:
                      print(f"Could not get ts for threading: {ts_err}")
              except SlackApiError as e:
                  print(f"files_upload_v2 failed: {e}")
          else:
              print(f"Chart not found at {png_path}, falling back to text message")
              try:
                  resp = client.chat_postMessage(channel=channel, text=message, mrkdwn=True)
                  parent_ts = resp["ts"]
              except SlackApiError as e:
                  print(f"chat_postMessage failed: {e}")
                  raise SystemExit(0)

          report = pathlib.Path("ai_failure_report.md")
          if parent_ts and report.exists() and int(failed or 0) > 0:
              content = report.read_text(encoding="utf-8").strip()
              if content and "No failures" not in content:
                  if len(content) > 3000:
                      content = content[:3000] + "\n... [see artifact for full report]"
                  try:
                      client.chat_postMessage(
                          channel=channel,
                          thread_ts=parent_ts,
                          text=f"🤖 *AI Failure Analysis — {env_display}*\n\n{content}",
                          mrkdwn=True,
                      )
                      print("AI analysis posted as thread reply")
                  except Exception as e:
                      print(f"AI thread post failed: {e}")
          PY

      - name: Set email vars
        if: ${{ success() || failure() }}
        id: configure_email
        uses: actions/github-script@v6
        env:
            JOB_STATUS: ${{ job.status }}
            CC_ENV: ${{ matrix.environment }}
        with:
          script: |
            const { promises: fs } = require('fs')
            const {JOB_STATUS, NOW, CC_ENV, GITHUB_HEAD_REF} = process.env
            const envLabels = {banner: "Staging", rogers: "QA", secure: "US Prod", securevoteu: "EU Prod"}
            const envDisplay = envLabels[CC_ENV] || CC_ENV
            const prefix = `[${envDisplay}] SureAdhere Extended Tests - ${JOB_STATUS.toUpperCase()} - Run #${context.runNumber}`
            const suffix = `at ${NOW}`
            let subject = `${prefix} on branch "${GITHUB_HEAD_REF}" ${suffix}`

            let bodyFile = './common_utilities/mail_templates/email_pass.md'
            if (JOB_STATUS !== 'success') {
              bodyFile = './common_utilities/mail_templates/email_fail.md'
            }

            let actionRunLink = context.payload.repository.html_url + `/actions/runs/${context.runId}`
            let testSuite = 'SureAdhere Extended Tests'
            let bodyContent = await fs.readFile(bodyFile, 'utf8')
            bodyContent = bodyContent.replace(/{{actionRunLink}}/g, actionRunLink)
                .replace(/{{runNumber}}/g, context.runNumber)
                .replace(/{{environment}}/g, envDisplay)
                .replace(/{{testSuite}}/g, testSuite)
            
            let receivers = 'qa-automation@dimagi.com'
            if (context.eventName !== "pull_request" || context.eventName !== "push") {
              receivers = 'qa@dimagi.com'
            }
            return {
              "subject": subject,
              "body": bodyContent,
              "reference": Math.random().toString(36).substr(2),  // used to prevent threading of similar emails
              "receivers": receivers
            }
      - name: Send Result Email
        if: ${{ success() || failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.DIMAGIQA_MAIL_USERNAME}}
          password: ${{secrets.DIMAGIQA_MAIL_PASSWORD}}
          subject: ${{ fromJSON(steps.configure_email.outputs.result).subject }}
          to: ${{ fromJSON(steps.configure_email.outputs.result).receivers }}
          from: <${{secrets.DIMAGIQA_MAIL_USERNAME}}>
          html_body: ${{ fromJSON(steps.configure_email.outputs.result).body }}
          convert_markdown: true
          attachments: sbase-extendedtests-artifacts-${{ matrix.environment }}.zip
          in_reply_to: ${{ fromJSON(steps.configure_email.outputs.result).reference }}


